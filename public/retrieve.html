<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>i was. — Platform-Free Retrieval</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,900;1,900&display=swap');
    body {
      background: #0D0B08;
      color: #E8E0D0;
      font-family: 'IBM Plex Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 48px;
      font-style: italic;
      font-weight: 900;
      color: #E8E0D0;
      margin-bottom: 8px;
      text-shadow: 0 0 40px rgba(196,98,45,0.3);
    }
    .sub {
      font-size: 12px;
      color: #A09585;
      letter-spacing: 0.08em;
      margin-bottom: 48px;
      text-align: center;
    }
    .box {
      width: 100%;
      max-width: 600px;
      background: #1A1714;
      padding: 32px;
    }
    label {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #C4622D;
      display: block;
      margin-bottom: 10px;
    }
    input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.15);
      color: #E8E0D0;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 14px;
      padding: 8px 0;
      outline: none;
      margin-bottom: 20px;
    }
    input:focus { border-bottom-color: #C4622D; }
    button {
      background: #C4622D;
      color: #0D0B08;
      border: none;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 12px 28px;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #result {
      margin-top: 28px;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 20px;
      display: none;
    }
    #result.show { display: block; }
    #result-text {
      font-size: 13px;
      color: #A09585;
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.7;
    }
    #result-media { width: 100%; margin-top: 12px; }
    #result-img { max-width: 100%; display: block; margin-top: 12px; }
    #result-audio { width: 100%; margin-top: 12px; accent-color: #C4622D; }
    .blob-link { color: #C4622D; font-size: 11px; word-break: break-all; margin-top: 8px; display: block; }
    .note {
      margin-top: 48px;
      font-size: 10px;
      color: #4A3F35;
      letter-spacing: 0.06em;
      text-align: center;
      max-width: 420px;
    }
  </style>
</head>
<body>
  <h1>i was.</h1>
  <p class="sub">Platform-free retrieval — zero dependencies — directly from Walrus nodes</p>

  <div class="box">
    <label>Blob ID</label>
    <input id="blobInput" type="text" placeholder="Paste a Walrus blob ID..." />
    <button id="fetchBtn" onclick="fetchBlob()">Retrieve from Walrus</button>

    <div id="result">
      <a id="blobLink" class="blob-link" target="_blank" rel="noreferrer"></a>
      <div id="result-text"></div>
      <img id="result-img" style="display:none" alt="mark" />
      <audio id="result-audio" style="display:none" controls></audio>
    </div>
  </div>

  <p class="note">
    This file has zero dependencies. It reads blobs directly from the Walrus decentralized network.
    Even if iwas.xyz disappears, your marks remain. Paste any blob ID to retrieve a mark.
  </p>

  <script>
    const AGGREGATOR = 'https://aggregator.walrus-testnet.walrus.space/v1/blobs'

    async function fetchBlob() {
      const blobId = document.getElementById('blobInput').value.trim()
      if (!blobId) return
      const btn = document.getElementById('fetchBtn')
      btn.disabled = true
      btn.textContent = 'Retrieving...'

      const url = `${AGGREGATOR}/${blobId}`
      const result = document.getElementById('result')
      const textEl = document.getElementById('result-text')
      const imgEl = document.getElementById('result-img')
      const audioEl = document.getElementById('result-audio')
      const linkEl = document.getElementById('blobLink')

      imgEl.style.display = 'none'
      audioEl.style.display = 'none'
      textEl.textContent = ''
      linkEl.href = url
      linkEl.textContent = url

      try {
        const res = await fetch(url)
        if (!res.ok) throw new Error(`HTTP ${res.status}`)
        const contentType = res.headers.get('content-type') || ''

        if (contentType.startsWith('image/')) {
          const blob = await res.blob()
          imgEl.src = URL.createObjectURL(blob)
          imgEl.style.display = 'block'
        } else if (contentType.startsWith('audio/')) {
          const blob = await res.blob()
          audioEl.src = URL.createObjectURL(blob)
          audioEl.style.display = 'block'
        } else {
          const text = await res.text()
          textEl.textContent = text
        }

        result.classList.add('show')
      } catch (err) {
        textEl.textContent = 'Error: ' + err.message
        result.classList.add('show')
      }

      btn.disabled = false
      btn.textContent = 'Retrieve from Walrus'
    }

    document.getElementById('blobInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') fetchBlob()
    })
  </script>
</body>
</html>
